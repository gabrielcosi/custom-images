name: Build Images

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  images:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.images.outputs.images }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Find image directories
        id: images
        run: |
          ruby <<'RUBY' >> "$GITHUB_OUTPUT"
          require "json"

          images = Dir.glob("images/*/Dockerfile")
            .map { |path| path.split("/")[1] }
            .sort

          abort "No images found" if images.empty?

          puts "images=#{JSON.generate(images)}"
          RUBY

  build:
    name: Build ${{ matrix.image }}
    needs: images
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.images.outputs.images) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read image configuration
        id: metadata
        env:
          IMAGE_DIR: images/${{ matrix.image }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          dockerfile="$IMAGE_DIR/Dockerfile"
          upstream_ref="$(awk '/^FROM /{print $2; exit}' "$dockerfile")"
          upstream_tag="${upstream_ref##*:}"

          if [ -z "$upstream_ref" ] || [ "$upstream_ref" = "$upstream_tag" ]; then
            echo "Missing tagged FROM image in $dockerfile" >&2
            exit 1
          fi

          {
            echo "image_dir=$IMAGE_DIR"
            echo "image_ref=ghcr.io/$REPOSITORY_OWNER/${{ matrix.image }}:$upstream_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.metadata.outputs.image_dir }}
          file: ${{ steps.metadata.outputs.image_dir }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.image_ref }}

      - name: Verify image ref
        run: |
          printf 'Built image ref: %s\n' '${{ steps.metadata.outputs.image_ref }}'
